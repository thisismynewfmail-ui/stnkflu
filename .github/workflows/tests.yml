name: Tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  suite:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: pyproject.toml
      # The simulation kernel is compiled on first use; ubuntu-latest has g++.
      - run: pip install -e '.[test]'
      - name: Start-up checks
        run: python startup.py --check
      - name: Test suite
        run: python -m pytest -q
        env:
          OPENBLAS_NUM_THREADS: '1'
      - name: Browser files parse
        run: |
          for f in flylab/web/*.js; do node --check "$f"; done
